name: Supabase Keep-Alive

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트가 일시정지(잠김)됩니다.
# 3일마다 가벼운 조회 요청을 보내 항상 활성 상태를 유지합니다.
on:
  schedule:
    - cron: '0 0 */3 * *' # 3일마다 09:00 KST
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://rfhbdwfmreamudgfafxc.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          [ "$code" = "200" ]
